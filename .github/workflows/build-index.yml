name: Build Registry Index
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: instabox-medium
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate packs.json and index.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          packs = json.loads(pathlib.Path("packs.json").read_text())
          index = json.loads(pathlib.Path("index.json").read_text())
          assert packs["schema"] == 1 and index["schema"] == 1
          for p in packs["packs"]:
              assert p["id"], "missing id"
              if "subdir" in p:
                  m = pathlib.Path(p["subdir"]) / "pack.json"
                  assert m.exists(), f"missing {m}"
                  data = json.loads(m.read_text())
                  assert data["schema"] == 1
                  for k, v in data["programs"].items():
                      icon = pathlib.Path(p["subdir"]) / v["icon"]
                      assert icon.exists() and icon.stat().st_size <= 32768
          print("Validated", len(packs["packs"]), "pack(s)")
          PY
      - name: Clone the theme packs of other repos at their ref
        # A theme pack in a repo of its own (docs/DSK-010-theme-ambience.md)
        # is listed with no subdir and the full commit SHA to install. GoRex
        # installs that commit, so CI checks the files of that commit.
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          REGISTRY = "https://github.com/si-mods/gorex-registry.git"
          idx = json.loads(pathlib.Path("index.json").read_text())
          src = json.loads(pathlib.Path("packs.json").read_text())
          packs = {t["id"]: t for t in src.get("themes", []) + src.get("extensions", [])}
          for t in idx.get("themes", []) + idx.get("extensions", []):
              if t.get("repo") == REGISTRY:
                  continue
              where = t.get("id")
              assert isinstance(where, str) and re.fullmatch(r"[A-Za-z0-9._-]+", where) and where not in (".", ".."), f"bad id {where!r}"
              assert "subdir" not in t, f"{where}: a pack of another repo has no subdir"
              assert re.fullmatch(r"https://[A-Za-z0-9./_-]+\.git", t.get("repo", "")), f"{where}: repo must be an https clone URL"
              assert re.fullmatch(r"[0-9a-f]{40}", t.get("ref", "")), f"{where}: ref must be a full commit SHA, not a branch or a tag"
              p = packs.get(where, {})
              assert p.get("ref") == t["ref"] and p.get("repo") == t["repo"], f"{where}: packs.json and index.json differ"
              d = pathlib.Path(".external") / where
              d.mkdir(parents=True)
              def git(*args):
                  return subprocess.run(["git", "-C", str(d), *args], check=True, capture_output=True, text=True).stdout.strip()
              git("init", "-q")
              git("remote", "add", "origin", t["repo"])
              git("fetch", "-q", "--depth", "1", "origin", t["ref"])
              git("checkout", "-q", "--detach", "FETCH_HEAD")
              assert git("rev-parse", "HEAD") == t["ref"], f"{where}: the clone is not at ref"
              print("Cloned", where, "at", t["ref"])
          PY
      - name: Validate theme packs
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          sys.path.insert(0, "scripts")
          import theme_assets
          # The seed and role names of GoRex's internal/theme
          # (docs/DSK-008-theme.md, docs/DSK-012-theme-shaders.md). GoRex
          # drops any other name at load.
          SEEDS = {
              "bgTop", "bgMid", "bgLow", "bgBottom", "bgTint",
              "text", "textMuted", "textFaint", "iconMuted", "emptyMark",
              "busy", "attention", "done", "exited", "danger",
              "accent", "accentHover", "accentPressed", "accentText",
              "panel", "field", "fieldBorder", "surface", "surfaceHover", "surfacePressed",
              "card", "cardFocused", "shadow", "shadowFocused", "backdrop", "pillTint",
          }
          ROLES = {
              "sideBar.activeGroupBackground", "sideBar.activeGroupTabBackground",
              "sideBar.activeGroupTabShadow", "sideBar.trackBackground",
              "sideBar.tabSeparator", "sideBar.tabHoverBackground",
              "sideBar.tabActiveBackground",
              "titleBar.background", "sideBar.background",
              "paneHeader.background", "button.background", "pane.border",
          }
          TERM = re.compile(r'[^/\\,"\x00-\x1f\x7f]{1,64}')
          HEX = re.compile(r"^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$")
          def color(v, where):
              if isinstance(v, dict):
                  assert set(v) == {"light", "dark"}, f"{where}: want light and dark"
                  for k in v:
                      color(v[k], f"{where}.{k}")
                  return
              assert isinstance(v, str) and HEX.match(v), f"{where}: bad color {v!r}"
          packs = json.loads(pathlib.Path("packs.json").read_text())
          index = json.loads(pathlib.Path("index.json").read_text())
          ids = [t["id"] for t in packs.get("themes", [])]
          assert ids == [t["id"] for t in index.get("themes", [])], "index.json themes differ from packs.json"
          for t in packs.get("themes", []):
              assert re.fullmatch(r"[A-Za-z0-9._-]+", t["id"]) and t["id"] not in (".", ".."), f"bad id {t['id']!r}"
              assert t.get("kind") == "theme", f"{t['id']}: kind must be theme"
              root = pathlib.Path(t["subdir"]) if "subdir" in t else pathlib.Path(".external") / t["id"]
              m = root / "theme.json"
              assert m.exists() and not m.is_symlink() and m.stat().st_size <= 65536, f"missing or large {m}"
              data = json.loads(m.read_text(encoding="utf-8"))
              # The keys GoRex's Parse knows. ambience, mascot, brand and
              # ticker stay allowed: GoRex v0.62 drops them with an
              # unknown-key warning, so the registry ignores them too.
              keys = {"name", "seeds", "roles", "terminal", "sidebar", "assets",
                      "metrics", "glass", "shaders", "description",
                      "ambience", "mascot", "brand", "ticker"}
              assert set(data) <= keys, f"{m}: unknown keys {set(data) - keys}"
              for app, seeds in data.get("seeds", {}).items():
                  assert app in ("light", "dark"), f"{m}: unknown appearance {app}"
                  for k, v in seeds.items():
                      assert k in SEEDS, f"{m}: unknown seed {k}"
                      assert isinstance(v, str), f"{m}: seeds.{app}.{k} is not a string"
                      color(v, f"{m}: seeds.{app}.{k}")
              for k, v in data.get("roles", {}).items():
                  assert k in ROLES, f"{m}: unknown role {k}"
                  color(v, f"{m}: roles.{k}")
              # terminal names a Ghostty theme for each appearance: no path,
              # comma, quote or control character. GoRex also drops a name
              # that Ghostty's list of themes does not have.
              term = data.get("terminal", {})
              assert isinstance(term, dict), f"{m}: terminal is not an object"
              for app, name in term.items():
                  assert app in ("light", "dark"), f"{m}: terminal: unknown appearance {app}"
                  assert isinstance(name, str) and TERM.fullmatch(name) and name not in (".", ".."), f"{m}: terminal.{app}: bad theme name {name!r}"
              # The asset files and shader references of
              # docs/DSK-012-theme-shaders.md.
              theme_assets.check(data, root, str(m))
          print("Validated", len(ids), "theme(s)")
          PY
      - name: Validate extension packs
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          packs = json.loads(pathlib.Path("packs.json").read_text())
          index = json.loads(pathlib.Path("index.json").read_text())
          ids = [e["id"] for e in packs.get("extensions", [])]
          assert ids == [e["id"] for e in index.get("extensions", [])], "index.json extensions differ from packs.json"
          for e in packs.get("extensions", []):
              assert re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,62}", e["id"]), f"bad id {e['id']!r}"
              assert e.get("kind") == "extension", f"{e['id']}: kind must be extension"
              assert re.fullmatch(r"[0-9a-f]{40}", e.get("ref", "") or "0" * 40) or "subdir" in e, \
                  f"{e['id']}: a pack of another repo must pin a full commit SHA"
              root = pathlib.Path(e["subdir"]) if "subdir" in e else pathlib.Path(".external") / e["id"]
              m = root / "ext.json"
              assert m.exists() and m.stat().st_size <= 65536, f"missing or large {m}"
              data = json.loads(m.read_text(encoding="utf-8"))
              assert data["id"] == e["id"], f"{m}: id {data['id']!r} != {e['id']!r}"
              assert data.get("engine") == "webview", f"{m}: unknown engine"
              assert data.get("panes"), f"{m}: declares no pane kind"
              assert (root / "index.html").exists(), f"missing index.html in {root}"
          print("Validated", len(ids), "extension(s)")
          PY
